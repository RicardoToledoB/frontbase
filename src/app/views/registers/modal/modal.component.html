<h2 mat-dialog-title>{{ data.id ? 'Editar Registro' : 'Nuevo Registro' }}</h2>

<mat-dialog-content class="mat-typography">
  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>N° Inventario</mat-label>
    <input matInput [(ngModel)]="data.n_inventary" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Descripción</mat-label>
    <input matInput [(ngModel)]="data.description_property" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Proyecto</mat-label>
    <input matInput [(ngModel)]="data.project" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Financiamiento</mat-label>
    <input matInput [(ngModel)]="data.financing" />
  </mat-form-field>

  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Estado</mat-label>
    <input matInput [(ngModel)]="data.state" />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-button color="primary" (click)="save()">Guardar</button>
</mat-dialog-actions>

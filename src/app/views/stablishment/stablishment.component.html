<div class="grid-container">
  <h1 class="mat-h1">Establecimientos</h1>
  <mat-divider></mat-divider>
  <br/>

  <mat-grid-list cols="2" rowHeight="100%">
    <mat-card appearance="outlined">
      <mat-card-header>
        <button mat-flat-button color="primary" (click)="openDialog()">
          <mat-icon>add</mat-icon>
          Nuevo
        </button>
        <span class="spacer"></span>
        <!-- Buscador -->
        <mat-form-field appearance="outline" class="search-box">
          <mat-label>Buscar</mat-label>
          <input matInput placeholder="Escriba para buscar..." (keyup)="applyFilter($event)" />
          <button mat-icon-button matSuffix aria-label="Buscar">
            <mat-icon>search</mat-icon>
          </button>
        </mat-form-field>

      </mat-card-header>

      <mat-divider></mat-divider>

      <mat-card-content>
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width">
          <!-- columnas -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>#.</th>
            <td mat-cell *matCellDef="let element">{{ element.id }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let element">{{ element.name }}</td>
          </ng-container>

          <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef>Creado</th>
            <td mat-cell *matCellDef="let element">
              {{ element.createdAt | date: 'dd-MM-yyyy HH:mm:ss' }}
            </td>
          </ng-container>

          <!-- Acciones -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button color="primary" (click)="edit(element)" matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="confirmDelete(element)" matTooltip="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>


        <br />
        <!-- 🔹 Paginador -->
        <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons>
        </mat-paginator>
      </mat-card-content>
    </mat-card>
  </mat-grid-list>
</div>

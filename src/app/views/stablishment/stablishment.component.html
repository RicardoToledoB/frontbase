<div class="grid-container">
  <h1 class="mat-h1">Home</h1>
  <mat-grid-list cols="2" rowHeight="100%">
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>
          <div class="header-actions">
            <!-- Botón "Nuevo" -->
            <button mat-flat-button color="primary" (click)="openDialog()">
              <mat-icon>add</mat-icon>
              Nuevo
            </button>

            <!-- Buscador -->
            <mat-form-field appearance="outline" class="search-box">
              <mat-label>Buscar</mat-label>
              <input matInput placeholder="Escriba para buscar..." />
              <button mat-icon-button matSuffix aria-label="Buscar">
                <mat-icon>search</mat-icon>
              </button>
            </mat-form-field>
          </div>
        </mat-card-title>
      </mat-card-header>

      <mat-divider></mat-divider>

      <mat-card-content>
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width">
          <!-- columnas -->
          <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef>No.</th>
            <td mat-cell *matCellDef="let element">{{element.position}}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let element">{{element.name}}</td>
          </ng-container>

          <ng-container matColumnDef="weight">
            <th mat-header-cell *matHeaderCellDef>Weight</th>
            <td mat-cell *matCellDef="let element">{{element.weight}}</td>
          </ng-container>

          <ng-container matColumnDef="symbol">
            <th mat-header-cell *matHeaderCellDef>Edit</th>
            <td mat-cell *matCellDef="let element">{{element.symbol}}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  </mat-grid-list>
</div>

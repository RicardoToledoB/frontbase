<div class="grid-container">
  <h1 class="mat-h1">Bienvenido!</h1>
  <mat-grid-list cols="2" rowHeight="350px">

    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title> Login</mat-card-title>
      
      </mat-card-header>
      <mat-card-content>
          <mat-form-field class="example-full-width">
            <mat-label>Correo Electronico</mat-label>
            <input matInput>
          </mat-form-field>

          <mat-form-field class="example-full-width">
            <mat-label>Clave Sistema</mat-label>
            <input matInput [type]="hide() ? 'password' : 'text'" />
            <button  mat-icon-button matSuffix (click)="clickEvent($event)" [attr.aria-label]="'Hide password'"
              [attr.aria-pressed]="hide()">
              <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
          </mat-form-field>



      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary">Ingresar</button>
      </mat-card-actions>
    </mat-card>

  </mat-grid-list>
</div>
